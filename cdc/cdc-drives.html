<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>PlacementPro | Company Drives</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="app-body" data-role="cdc">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="app-main">
        <header class="topbar">
            <div><span class="eyebrow">CDC PORTAL / COMPANIES</span>
                <h1>Company Drives</h1>
            </div>
            <div class="user-mini"><span class="cdc-avatar">C</span>
                <div><b>CDC Admin</b><small>Placement Cell</small></div>
            </div>
        </header>
        <section class="drive-grid">
            <article class="drive-card">
                <div class="company-logo">TCS</div>
                <h2>Tata Consultancy Services</h2>
                <p>Software Engineer • 4.5 LPA</p><span>III / IV • CSE</span><button class="btn btn-outline"
                    onclick="demoAction('TCS management')">Manage Drive</button>
            </article>
            <article class="drive-card">
                <div class="company-logo blue-bg">INF</div>
                <h2>Infosys</h2>
                <p>Systems Engineer • 5.0 LPA</p><span>III / IV • CSE, IT</span><button class="btn btn-outline"
                    onclick="demoAction('Infosys management')">Manage Drive</button>
            </article>
            <article class="drive-card">
                <div class="company-logo purple-bg">ACC</div>
                <h2>Accenture</h2>
                <p>Associate Software Engineer • 6.0 LPA</p><span>III / IV</span><button class="btn btn-outline"
                    onclick="demoAction('Accenture management')">Manage Drive</button>
            </article>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
